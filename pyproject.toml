[project]
name = "langflow-parsers"
version = "1.0.0"
description = "Langflow custom components that extract text and images from DOCX and PDF files for multimodal RAG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ivan Afanasov" }]
requires-python = ">=3.10"
keywords = ["langflow", "rag", "multimodal", "document-parsing", "docx", "pdf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
# Runtime dependencies of the components. Langflow itself is not listed:
# the components run inside an existing Langflow installation.
dependencies = [
    "pillow>=10.0",
    "pymupdf>=1.24.3",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
# Components are loaded by Langflow from a folder, not installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["components"]
addopts = "-ra"

[tool.coverage.run]
source = ["components"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF012",  # Langflow declares inputs/outputs as mutable class attributes
]

[tool.ruff.lint.isort]
known-first-party = ["parsers"]
known-local-folder = ["conftest"]

[tool.ruff.format]
quote-style = "single"
